[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgap"
version = "0.1.0"
description = "Local-first, evidence-based resume and job description comparison"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "pdfplumber>=0.11,<1",
    "sentence-transformers>=3,<6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "filelock>=3,<5",
    "langsmith>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["skillgap*"]

[tool.setuptools.package-data]
skillgap = ["prompts/*.txt", "web/*.html", "web/*.css", "web/*.js", "examples/*.txt"]

[tool.pytest.ini_options]
testpaths = ["skillgap/tests"]
